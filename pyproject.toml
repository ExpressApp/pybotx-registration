[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pybotx-registration"
version = "0.1.0"
description = "Secure BotX secret-delivery protocol implementation for pybotx bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dependency-injector>=4.41",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyNaCl>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "check-wheel-contents>=0.6,<1",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "pybotx==0.77.0",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["pybotx_registration"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/pybotx_registration"]
