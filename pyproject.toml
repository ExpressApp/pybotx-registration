[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pybotx-registration"
version = "0.1.0"
description = "Secure BotX secret-delivery protocol implementation for pybotx bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dependency-injector>=4.41",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyNaCl>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pybotx==0.77.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/pybotx_registration"]
