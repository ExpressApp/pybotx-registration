name: Publish python package

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, build and publish
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/pybotx-registration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert tag is from master
        run: |
          git fetch origin master --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Validate release version
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$package_version" = "${GITHUB_REF_NAME#v}"

      - name: Test, lint and build package
        run: |
          uv run pytest --cov=pybotx_registration --cov-report=term-missing
          uv run ruff check src tests
          uv run mypy src tests
          uv build
          uv run check-wheel-contents dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
